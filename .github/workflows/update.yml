name: Cap nhat gia vang

on:
  schedule:
    - cron: "0 2 * * *"   # 09:00 giờ Việt Nam (UTC+7)
    - cron: "30 8 * * *"  # 15:30 giờ Việt Nam
  workflow_dispatch:       # cho phép bấm chạy tay

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cai dat trinh duyet
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Lay gia vang
        run: python scrape.py
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data
          git diff --cached --quiet || git commit -m "Cap nhat gia vang $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
